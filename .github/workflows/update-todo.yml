name: Update TODO lists

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  update-todos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Find and update TODOs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: .github:.
        run: python -m workflow_scripts.update_todos